global-variables:
- name: rotation
  type: typeof(quaternion)
  comment: rotation is an alias for quaternion.
- name: LLEvents
  type: LLEvents
  comment: Event registration and management singleton for Second Life events.
- name: LLTimers
  type: LLTimers
  comment: Timer management singleton for scheduling periodic and one-time callbacks.
functions:
- name: assert
  type-parameters:
  - T
  parameters:
  - name: value
    type: T?
    comment: Value to check for truthiness.
  - name: errorMessage
    type: string?
    comment: Error message to display if the value is not truthy.
    default-value: '"assertion failed!"'
  return-type: T
  comment: Checks if the value is truthy; if not, raises an error with the optional
    message. Returns the value upon success.
  typechecker:
    magic: true
- name: collectgarbage
  parameters:
  - name: option
    type: '"collect"?'
    selene-type: string
  comment: Run the garbage collector
  overloads:
  - parameters:
    - name: option
      type: '"count"'
      selene-type: string
    return-type: number
    comment: Alias for gcinfo
  local-only: true
- name: dangerouslyexecuterequiredmodule
  parameters:
  - name: f
    type: (...any) -> ...any
  return-type: '...any'
  comment: Dangerously executes a required module function
- name: error
  type-parameters:
  - T
  parameters:
  - name: message
    type: T
    comment: Error message, or object, to raise. Does not have to be a string.
  - name: level
    type: number?
    comment: Level to attribute the error to in the call stack. Level 1 is the current
      function, level 2 is its caller, and so on.
    default-value: 1
  return-type: never
  comment: Raises an error with the specified object. The optional level determines
    which call stack level is blamed for the error.
- name: gcinfo
  return-type: number
  comment: Returns the total heap size in kilobytes.
- name: getfenv
  parameters:
  - name: target
    type: ((...any) -> ...any) | number
    selene-type: function
  return-type: '{[string]: any}'
  comment: Get the scoped environment for the given function.
  slua-removed: true
- name: getmetatable
  type-parameters:
  - T
  parameters:
  - name: obj
    type: T
    comment: Object to get the metatable for.
    selene-type: table
  return-type: getmetatable<T>
  comment: Returns the metatable for the specified object. If the metatable has a
    '__metatable' field, returns its value instead.
  typechecker:
    builtin: true
- name: graphheap
  parameters:
  - name: path
    type: string
  comment: Writes the contents of heap to the given file in JSON format. Intended
    to be used with tools/graphanalyze.py
  local-only: true
- name: graphuserheap
  parameters:
  - name: path
    type: string
  comment: Writes the contents of user heap to the given file in JSON format. Intended
    to be used with tools/graphanalyze.py
  local-only: true
- name: ipairs
  type-parameters:
  - V
  parameters:
  - name: tab
    type: '{V}'
    comment: Table to iterate over.
  return-type: (({V}, number) -> (number?, V), {V}, number)
  comment: Returns an iterator for sequential integer key-value pairs in the table.
    Iteration starts at 1 and halts at the first nil value.
- name: loadstring
  type-parameters:
  - A...
  parameters:
  - name: src
    type: string
  - name: chunkname
    type: string?
  return-type: (((A...) -> any)?, string?)
  comment: Compile Luau code into a function.
  slua-removed: true
- name: newproxy
  parameters:
  - name: mt
    type: boolean?
    comment: Boolean to create a modifiable metatable.
    default-value: false
  return-type: any
  comment: Creates a new untyped userdata object with an optional metatable.
- name: next
  type-parameters:
  - K
  - V
  parameters:
  - name: t
    type: '{[K]: V}'
    comment: Table to traverse.
  - name: i
    type: K?
    comment: Key to start traversal after. Omit or pass nil to fetch the first key-value
      pair.
    default-value: nil
  return-type: (K?, V)
  comment: Returns the next key-value pair in the table traversal order. If the index
    is nil or omitted, returns the first pair.
- name: pairs
  type-parameters:
  - K
  - V
  parameters:
  - name: t
    type: '{[K]: V}'
    comment: Table to iterate over.
  return-type: '(({[K]: V}, K?) -> (K?, V), {[K]: V}, K)'
  comment: Returns an iterator for all key-value pairs in the table.
- name: pcall
  type-parameters:
  - A...
  - R...
  parameters:
  - name: f
    type: (A...) -> R...
    comment: A function to be called.
  - name: '...'
    type: A...
    comment: Arguments to pass to the function.
  return-type: (boolean, R...)
  comment: Executes function f in protected mode, calling it with the provided arguments.
    Returns a boolean indicating success. If true, it also returns the function's
    results. If false, it returns the error message.
  typechecker:
    magic: true
- name: print
  type-parameters:
  - T...
  parameters:
  - name: '...'
    type: T...
    comment: Arguments to send as text to the object owner.
  comment: Sends all arguments as text privately to the object owner, separated by
    4 spaces. The owner must be currently in the same region for the message to be
    received.
- name: rawequal
  type-parameters:
  - T1
  - T2
  parameters:
  - name: a
    type: T1
    comment: First object to compare.
  - name: b
    type: T2
    comment: Second object to compare.
  return-type: boolean
  comment: Returns true if a and b have the same type and value or reference, bypassing
    the __eq metamethod..
- name: rawget
  type-parameters:
  - K
  - V
  parameters:
  - name: t
    type: '{[K]: V}'
    comment: Table to perform the lookup on.
  - name: k
    type: K
    comment: Key to look up in the table.
  return-type: V?
  comment: Performs a table lookup, bypassing the __index metamethod..
- name: rawlen
  type-parameters:
  - K
  - V
  parameters:
  - name: t
    type: '{[K]: V} | string'
    comment: Table or string to compute the length of.
  return-type: number
  comment: Returns the length of a table or string, bypassing the __len metamethod..
- name: rawset
  type-parameters:
  - K
  - V
  parameters:
  - name: t
    type: '{[K]: V}'
    comment: Table to assign the value to.
  - name: k
    type: K
    comment: Key to assign the value to.
  - name: v
    type: V
    comment: Value to assign.
  return-type: '{[K]: V}'
  comment: Assigns a value to a table field, bypassing the __newindex metamethod..
- name: require
  parameters:
  - name: target
    type: any
    comment: Name of the external module.
  return-type: any
  comment: Execute the named external module.
  typechecker:
    magic: true
- name: select
  type-parameters:
  - A...
  parameters:
  - name: i
    type: string | number
    comment: Index integer, or '#' to return the total arguments count. Supports negative
      indexing.
  - name: '...'
    type: A...
    comment: Arguments to select from.
  return-type: '...any'
  comment: Returns a subset of arguments starting from the specified index. Supports
    negative indexing. If index is '#', returns the number of arguments.
  typechecker:
    magic: true
- name: setfenv
  type-parameters:
  - T...
  - R...
  parameters:
  - name: target
    type: number | (T...) -> R...
    selene-type: function
  - name: env
    type: '{[string]: any}'
  return-type: ((T...) -> R...)?
  comment: Set the scoped environment for the given function.
  slua-removed: true
- name: setmetatable
  type-parameters:
  - T
  - MT
  parameters:
  - name: t
    type: T
    comment: Table to set the metatable for.
    selene-type: table
  - name: mt
    type: MT
    comment: Metatable to set.
    selene-type: table
  return-type: setmetatable<T, MT>
  comment: Changes the metatable for the given table. Raises an error if the table
    already has a protected metatable (it has a '__metatable' field).
  typechecker:
    builtin: true
    magic: true
- name: tonumber
  parameters:
  - name: value
    type: string? | number
    comment: String to convert to a number.
    selene-type: string
  - name: base
    type: number?
    comment: Base for the conversion. Valid range is [2, 36].
    default-value: 10
  return-type: number?
  comment: Converts the input string to a number in the specified base. Returns nil
    if invalid.
  must-use: true
- name: toquaternion
  parameters:
  - name: value
    type: string? | quaternion
    comment: String to convert to a quaternion.
    selene-type: string
  return-type: quaternion?
  comment: Converts a string to a quaternion. Returns nil if invalid.
  must-use: true
- name: torotation
  parameters:
  - name: value
    type: string? | quaternion
    comment: String to convert to a rotation.
    selene-type: string
  return-type: quaternion?
  comment: Converts a string to a rotation (quaternion). Returns nil if invalid.
  must-use: true
- name: tostring
  type-parameters:
  - T
  parameters:
  - name: value
    type: T
    comment: Object to convert to a string.
  return-type: string
  comment: Converts the input object to a string. Calls the metatable's '__tostring'
    metamethod if present.
- name: touuid
  parameters:
  - name: val
    type: string? | buffer | uuid
    comment: String or buffer to convert to a uuid.
    selene-type: string
  return-type: uuid?
  comment: Creates a new uuid from a string, buffer, or existing uuid. Returns nil
    if the string is not a valid UUID, or the buffer is shorter than 16 bytes.
  must-use: true
- name: tovector
  parameters:
  - name: val
    type: string? | vector
    comment: String to convert to a vector.
    selene-type: string
  return-type: vector?
  comment: Converts a string to a vector. Returns nil if invalid.
  must-use: true
- name: type
  type-parameters:
  - T
  parameters:
  - name: obj
    type: T
    comment: Object to get the type of.
  return-type: string
  comment: Returns the type of the object as a string.
  must-use: true
- name: typeof
  type-parameters:
  - T
  parameters:
  - name: obj
    type: T
    comment: Object to get the type of.
  return-type: string
  comment: Returns the type of the object, including custom userdata types.
  must-use: true
- name: unpack
  type-parameters:
  - V
  parameters:
  - name: tab
    type: '{V}'
    comment: Array from which to extract values.
  - name: i
    type: number?
    comment: Starting index.
    default-value: 1
  - name: j
    type: number?
    comment: Ending index.
    default-value: '#tab'
  return-type: '...V'
  comment: Returns values from an array in the specified index range.
- name: xpcall
  type-parameters:
  - E
  - A...
  - R1...
  - R2...
  parameters:
  - name: f
    type: (A...) -> R1...
    comment: A function to be called.
  - name: err
    type: (E) -> R2...
    comment: Error handler function.
  - name: '...'
    type: A...
    comment: Arguments to pass to the function.
  return-type: (boolean, R1...)
  comment: Calls function f with the provided arguments, handling errors with err
    if they occur.
modules:
- name: bit32
  comment: Bitwise operations library.
  functions:
  - name: arshift
    parameters:
    - name: val
      type: number
      comment: Integer to shift.
    - name: i
      type: number
      comment: Number of bits to shift.
    return-type: number
    comment: 'Returns val shifted by i bits to the right. If i is negative, a left
      shift is performed.

      Does an arithmetic shift: The most significant bit of n is propagated during
      the shift.

      Returns 0 if i < -31, or all sign bits if i > 31.'
    must-use: true
  - name: band
    parameters:
    - name: '...'
      type: '...number'
      comment: Integers to perform bitwise AND on.
    return-type: number
    comment: Returns the bitwise AND of the given numbers.
    must-use: true
  - name: bnot
    parameters:
    - name: val
      type: number
      comment: Integer to negate.
    return-type: number
    comment: Returns the bitwise negation of val.
    must-use: true
  - name: bor
    parameters:
    - name: '...'
      type: '...number'
      comment: Integers to perform bitwise OR on.
    return-type: number
    comment: Returns the bitwise OR of the given numbers.
    must-use: true
  - name: bxor
    parameters:
    - name: '...'
      type: '...number'
      comment: Integers to perform bitwise XOR on.
    return-type: number
    comment: Returns the bitwise XOR of the given numbers.
    must-use: true
  - name: btest
    parameters:
    - name: '...'
      type: '...number'
      comment: Integers to perform bitwise AND on.
    return-type: boolean
    comment: Returns true if the bitwise AND of the given numbers is non-zero.
    must-use: true
  - name: extract
    parameters:
    - name: src
      type: number
      comment: Integer to extract from.
    - name: field
      type: number
      comment: Starting bit index, zero-based
    - name: width
      type: number?
      comment: Number of bits to extract, or 1 if omitted.
      default-value: 1
    return-type: number
    comment: Returns width bits from src, starting from bit index field. Raises an
      error if the selected bit range is goes outside the range [0, 31].
    must-use: true
  - name: lrotate
    parameters:
    - name: val
      type: number
      comment: Integer to rotate.
    - name: i
      type: number
      comment: Number of bits to rotate.
    return-type: number
    comment: Returns val rotated by i bits to the left. If i is negative, a right
      rotate is performed.
    must-use: true
  - name: lshift
    parameters:
    - name: val
      type: number
      comment: Integer to shift.
    - name: i
      type: number
      comment: Number of bits to shift.
    return-type: number
    comment: Returns val shifted by i bits to the left. If i is negative, a right
      shift is performed. Returns 0 if i is outside the [-31, 31] range.
    must-use: true
  - name: replace
    parameters:
    - name: dst
      type: number
      comment: Integer to replace bits in.
    - name: src
      type: number
      comment: Integer containing the replacement bits.
    - name: field
      type: number
      comment: Starting bit index, zero-based
    - name: width
      type: number?
      comment: Number of bits to replace, or 1 if omitted.
      default-value: 1
    return-type: number
    comment: Returns dst with width bits replaced from src, starting from bit index
      field. Raises an error if the selected bit range goes outside the range [0,
      31].
    must-use: true
  - name: rrotate
    parameters:
    - name: val
      type: number
      comment: Integer to rotate.
    - name: i
      type: number
      comment: Number of bits to rotate.
    return-type: number
    comment: Returns val rotated by i bits to the right. If i is negative, a left
      rotate is performed.
    must-use: true
  - name: rshift
    parameters:
    - name: val
      type: number
      comment: Integer to shift.
    - name: i
      type: number
      comment: Number of bits to shift.
    return-type: number
    comment: Returns val shifted by i bits to the right. If i is negative, a left
      shift is performed. Returns 0 if i is outside the [-31, 31] range.
    must-use: true
  - name: s32
    parameters:
    - name: val
      type: number
      comment: Integer to truncate.
    return-type: number
    comment: Returns val, wrapped from float64 range to signed int32 range and truncated
      to integer. Makes integer arithmetic compatable with LSL.
    must-use: true
  - name: smul
    parameters:
    - name: val1
      type: number
      comment: Left factor.
    - name: val2
      type: number
      comment: Right factor.
    return-type: number
    comment: Returns the product of two signed 32-bit integers as a signed 32-bit
      integer, wrapping as necessary. Avoids precision loss associated with float64
      multiplication. Compatible with LSL integer multiplication.
    must-use: true
  - name: countlz
    parameters:
    - name: val
      type: number
      comment: Integer to count leading zeros in.
    return-type: number
    comment: Returns the count of val's leading zeros.
    must-use: true
  - name: countrz
    parameters:
    - name: val
      type: number
      comment: Integer to count trailing zeros in.
    return-type: number
    comment: Returns the count of val's trailing zeros.
    must-use: true
  - name: byteswap
    parameters:
    - name: val
      type: number
      comment: Integer whose byte order will be swapped.
    return-type: number
    comment: Returns val with its bytes swapped to the reverse order.
    must-use: true
- name: buffer
  comment: Buffer manipulation library for binary data.
  functions:
  - name: create
    parameters:
    - name: size
      type: number
      comment: Size of the buffer to create.
    return-type: buffer
    comment: Creates a buffer of the requested size with all bytes initialized to
      0.
    must-use: true
  - name: fromstring
    parameters:
    - name: str
      type: string
      comment: String to initialize the buffer with.
    return-type: buffer
    comment: Creates a buffer initialized to the contents of the string.
    must-use: true
  - name: tostring
    parameters:
    - name: b
      type: buffer
      comment: Buffer to convert to a string.
    return-type: string
    comment: Returns the buffer data as a string.
    must-use: true
  - name: readi8
    parameters:
    - name: b
      type: buffer
      comment: Buffer to read from.
    - name: offset
      type: number
      comment: 0-based byte offset to read from.
    return-type: number
    comment: Reads a signed 8-bit integer from the buffer at the given offset.
    must-use: true
  - name: readu8
    parameters:
    - name: b
      type: buffer
      comment: Buffer to read from.
    - name: offset
      type: number
      comment: 0-based byte offset to read from.
    return-type: number
    comment: Reads an unsigned 8-bit integer from the buffer at the given offset.
