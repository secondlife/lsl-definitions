- name: SIT_NO_SIT_TARGET
  type: number
  value: '-3'
  comment: Sit error code indicating that no open or available sit target could be
    found in the linkset.
- name: SIT_OK
  type: number
  value: '1'
  comment: Sit error code indicating that the agent was seated successfully.
